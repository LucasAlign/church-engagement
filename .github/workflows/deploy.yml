name: Deploy to GitHub Pages

# Builds the app and publishes it to the `gh-pages` branch (the source GitHub
# Pages serves from) on every push to the default branch. Pages is a project
# site at /church-engagement/, so the build uses that base path. The app uses
# HashRouter, so no SPA 404 fallback is needed.

on:
  push:
    branches: [claude/optimistic-carson-cu8vmc]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (Pages base path)
        run: npm run build -- --base=/church-engagement/

      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
